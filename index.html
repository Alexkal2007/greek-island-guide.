<!DOCTYPE html>
<html lang="el">
<head>
 <link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREEK ISLAND GUIDE</title>
<link rel="stylesheet" href="styles.css">
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .splash {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #EAF6FF 0%, #FFFFFF 100%);
    position: relative;
    text-align: center;
    padding: 60px 20px;
  }
  .splash-lang {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
  }
  .lang-toggle {
    background: #ffffff;
    border: 1.5px solid var(--sea, #0B5FA5);
    color: var(--sea, #0B5FA5);
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-toggle:hover {
    background: var(--sea, #0B5FA5);
    color: #fff;
  }
  .ship-wrap {
    width: clamp(140px, 30vw, 220px);
    height: auto;
    margin-bottom: 18px;
    animation: bob 3.6s ease-in-out infinite;
  }
  .ship-wrap svg {
    width: 100%;
    height: auto;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .splash-subtitle {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sea, #0B5FA5);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .splash h1 {
    font-family: 'Fraunces', serif, Georgia;
    font-weight: 600;
    font-size: clamp(24px, 5vw, 38px);
    color: var(--sea-deep, #0A3D66);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .splash p {
    color: var(--ink-soft, #4A5568);
    font-size: clamp(14px, 2.5vw, 16px);
    max-width: 520px;
    line-height: 1.5;
    margin: 0 auto 28px;
  }
  .splash .enter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 36px;
    border-radius: 999px;
    background: var(--sea, #0B5FA5);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .splash .enter:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(11,95,165,0.32);
  }
  .splash .brand {
    position: absolute;
    bottom: 20px;
    font-family: 'IBM Plex Mono', monospace, sans-serif;
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft, #64748B);
    padding: 0 10px;
    white-space: nowrap;
  }

  @media (max-height: 650px) {
    .splash {
      padding: 40px 15px 70px;
    }
    .ship-wrap {
      width: 120px;
      margin-bottom: 10px;
    }
    .splash .brand {
      position: relative;
      bottom: auto;
      margin-top: 30px;
    }
  }
</style>
</head>
<body>

<div class="splash">
  <button class="lang-toggle splash-lang" onclick="toggleLang()">
    <span class="lang-label">EL</span>
  </button>

  <div class="ship-wrap">
    <svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 108 C 60 96, 160 96, 190 108 L 172 132 C 140 122, 80 122, 48 132 Z" fill="#0B5FA5"/>
      <rect x="98" y="46" width="6" height="58" fill="#0A3D66"/>
      <path d="M104 52 L150 78 L104 88 Z" fill="#4FA8DA"/>
      <path d="M98 58 L64 82 L98 90 Z" fill="#EAF6FF" stroke="#0A3D66" stroke-width="1.5"/>
      <rect x="70" y="100" width="16" height="10" rx="2" fill="#0A3D66"/>
      <rect x="130" y="100" width="16" height="10" rx="2" fill="#0A3D66"/>
      <path d="M10 122 C 30 116, 45 128, 65 122 S 100 116, 120 122 S 155 128, 175 122 S 200 116, 215 122" fill="none" stroke="#4FA8DA" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 134 C 22 128, 40 140, 62 134 S 100 128, 122 134 S 158 140, 180 134 S 205 128, 220 134" fill="none" stroke="#DCEFFB" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="splash-subtitle" data-en="WELCOME TO THE AEGEAN" data-el="ΚΑΛΩΣ ΗΡΘΑΤΕ ΣΤΟ ΑΙΓΑΙΟ">WELCOME TO THE AEGEAN</div>

  <h1 data-en="Greek Island Guide" data-el="Οδηγός Ελληνικών Νησιών">Greek Island Guide</h1>

  <p data-en="Discover hidden beaches, authentic villages, local flavors, and seamless ferry connections across the Greek archipelago." 
     data-el="Ανακαλύψτε κρυφές παραλίες, παραδοσιακά χωριά, τοπικές γεύσεις και ακτοπλοϊκές διαδρομές για τα ομορφότερα ελληνικά νησιά.">
    Discover hidden beaches, authentic villages, local flavors, and seamless ferry connections across the Greek archipelago.
  </p>

  <a class="enter" href="main.html" data-en="Explore Now" data-el="Εξερεύνηση">Explore Now</a>

  <span class="brand" data-en="GREEK ISLAND GUIDE" data-el="ΟΔΗΓΟΣ ΕΛΛΗΝΙΚΩΝ ΝΗΣΙΩΝ">GREEK ISLAND GUIDE</span>
</div>

<script>
  let currentLang = 'en';

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'el' : 'en';
    
    // Ενημέρωση κειμένων
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute(`data-${currentLang}`);
    });

    // Ενημέρωση label στο κουμπί
    document.querySelector('.lang-label').textContent = currentLang === 'en' ? 'EL' : 'EN';
  }
</script>
<script src="i18n.js"></script>
</body>
</html>
